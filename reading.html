<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日文章 · EverWord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=1.8.6">
<script>document.documentElement.className += " js";</script>
</head>
<body data-page="reading">

<nav class="nav">
  <a class="brand" href="index.html"><span class="brand-mark">E</span><span class="brand-name">EverWord</span></a>
  <a href="index.html" data-nav="home">首页</a>
  <a href="words.html" data-nav="words">单词</a>
  <a href="reading.html" data-nav="reading">阅读</a>
  <a href="quiz.html" data-nav="quiz">测验</a>
  <a href="bank.html" data-nav="bank">题库</a>
</nav>

<main class="wrap">
  <section class="page-head rv">
    <span class="eyebrow">Daily Reading · 分级沉浸阅读</span>
    <h1>今日文章</h1>
    <div class="lvl-tabs" id="lvl-tabs">
      <button data-lv="1">低 · 约 2000 词面</button>
      <button data-lv="2" class="active">中 · 约 4500 词面</button>
      <button data-lv="3">高 · 约 8000 词面</button>
    </div>
    <div class="a-picker" id="a-picker"></div>
  </section>

  <!-- 全库检索：100 篇文章（标题/主题/正文）+ 全部词库（词形/释义），支持拼写模糊 -->
  <section class="search-panel rv">
    <div class="sp-box">
      <svg class="sp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="r-search" type="search" placeholder="检索整个文库与词库：标题 / 主题 / 正文 / 单词释义……支持拼写模糊与中文" autocomplete="off" spellcheck="false" aria-label="检索文库与词库">
      <button class="sp-clear" id="rsp-clear" hidden>清空</button>
    </div>
    <p class="sp-meta" id="rsp-meta" hidden></p>
    <div class="sp-results" id="rsp-results" hidden></div>
    <div class="sp-detail" id="rsp-detail" hidden></div>
  </section>

  <div class="read-grid rv">
    <div class="read-main">
      <article class="bezel"><div class="core article" id="article"></div></article>

      <div class="read-foot rv">
        <button class="btn btn-primary" id="mark-read">
          <svg class="ic" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg><span>标记已完成阅读</span>
        </button>
        <button class="btn btn-ghost" id="next-art" title="推送到同级别下一篇原创文章">
          <span>推送下一篇</span><span class="btn-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg></span>
        </button>
        <a class="btn btn-ghost" href="quiz.html">去做每日测验<span class="btn-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg></span></a>
      </div>
      <p class="tip-note rv">提示：悬停文中带 <span class="tk-demo">虚线下划线</span> 的单词即可查词；右侧词汇栏列出本文<b>重要词汇</b>，点击词条可定位到正文出现处。</p>
    </div>

    <aside class="vocab-rail" id="vocab-rail" aria-label="本文重要词汇">
      <div class="vr-head">
        <span class="vr-title">重要词汇</span>
        <span class="vr-count" id="vr-count">0</span>
      </div>
      <p class="vr-sub">点击词条定位正文 · 悬停联动高亮</p>
      <div id="vr-list"></div>
    </aside>
  </div>

  <section class="news-sec rv">
    <div class="ns-card">
      <div class="ns-head">
        <span class="ns-title">新闻速览</span>
        <span class="ns-badge" id="ns-badge">快照</span>
        <button class="ns-refresh" id="ns-refresh" hidden>刷新</button>
      </div>
      <!-- v1.5 表盘：每日新增量走势与类型分布（服务器模式；file:// 快照模式自动隐藏） -->
      <div class="ns-dash" id="ns-dash" hidden>
        <div class="nsd-kpis">
          <div class="nsd-kpi"><span class="nsd-num" id="nsd-today">0</span><span class="nsd-lab">今日新增</span></div>
          <div class="nsd-kpi"><span class="nsd-num" id="nsd-week">0</span><span class="nsd-lab">近 7 天新增</span></div>
          <div class="nsd-kpi"><span class="nsd-num" id="nsd-total">0</span><span class="nsd-lab">入库总量</span></div>
          <div class="nsd-kpi"><span class="nsd-num" id="nsd-readable">0</span><span class="nsd-lab">可精读</span></div>
        </div>
        <div class="nsd-cols">
          <div class="nsd-block">
            <span class="nsd-cap">近 7 天每日新增</span>
            <div class="nsd-bars" id="nsd-bars"></div>
          </div>
          <div class="nsd-block">
            <span class="nsd-cap">今日新增 · 按类型</span>
            <div class="nsd-rows" id="nsd-src"></div>
          </div>
        </div>
      </div>
      <!-- v1.5 检索：标题/摘要多词模糊匹配 + 日期过滤（服务器模式） -->
      <div class="ns-search" id="ns-search" hidden>
        <input class="ns-q" id="ns-q" type="search" placeholder="检索新闻：标题 / 摘要关键词，多词空格分隔" maxlength="60">
        <select class="ns-date" id="ns-date-mode" title="按发布日期过滤">
          <option value="">全部日期</option>
          <option value="today">今天</option>
          <option value="7">近 7 天</option>
          <option value="30">近 30 天</option>
          <option value="date">指定日期…</option>
        </select>
        <input class="ns-date" id="ns-date" type="date" hidden>
        <button class="ns-go" id="ns-go">检索</button>
        <button class="ns-reset" id="ns-reset" hidden>清除</button>
      </div>
      <div class="ns-chips" id="ns-chips"></div>
      <div class="ns-list" id="ns-list"></div>
      <p class="ns-note" id="ns-note"></p>
    </div>
  </section>

  <!-- 新闻精读浮层：服务器模式下点「精读」打开（悬浮取词 + TTS + 新闻热词栏） -->
  <div class="ns-reader" id="ns-reader" hidden>
    <div class="nsr-panel">
      <div class="nsr-head">
        <div class="nsr-meta">
          <span class="nsr-src" id="nsr-src"></span>
          <span id="nsr-topic"></span>
          <span id="nsr-date"></span>
        </div>
        <button class="nsr-close" id="nsr-close" aria-label="关闭精读">✕ 关闭</button>
      </div>
      <div class="nsr-grid">
        <div class="nsr-main">
          <h2 class="nsr-title" id="nsr-title"></h2>
          <p class="nsr-src-note">
            <a id="nsr-link" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a> · 正文缓存自来源媒体 RSS/页面，仅供个人学习
          </p>
          <div class="a-bar">
            <button class="btn btn-ghost btn-sm" id="nsr-play"><svg class="ic" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg><span>播放全文</span></button>
            <button class="btn btn-ghost btn-sm" id="nsr-stop"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>停止</span></button>
            <div class="rate" id="nsr-rate">
              <span>语速</span>
              <button data-r="0.8">0.8×</button>
              <button data-r="1" class="active">1×</button>
              <button data-r="1.2">1.2×</button>
            </div>
          </div>
          <div class="prose" id="nsr-prose"></div>
        </div>
        <aside class="vocab-rail nsr-rail" aria-label="新闻热词">
          <div class="vr-head">
            <span class="vr-title">新闻热词</span>
            <span class="vr-count" id="nsr-count">0</span>
          </div>
          <p class="vr-sub">点击词条定位正文 · 悬停取词</p>
          <div id="nsr-vr"></div>
        </aside>
      </div>
    </div>
  </div>
</main>

<footer class="foot">
  <p class="foot-brand">EverWord</p>
  <p class="foot-tag">科学记忆 · 沉浸阅读 · 主动回忆</p>
</footer>

<script src="js/icons.js?v=1.8.6"></script>
<script src="js/data.js?v=1.8.6"></script>
<script src="js/articles-ext.js?v=1.8.6"></script>
<script src="js/api.js?v=1.8.6"></script>
<script src="js/srs.js?v=1.8.6"></script>
<script src="js/settings.js?v=1.8.6"></script>
<script src="js/tts.js?v=1.8.6"></script>
<script src="js/app.js?v=1.8.6"></script>
<script src="js/news-data.js?v=1.8.6"></script>
<script>
(function () {
  const artEl = document.getElementById("article");
  const tabs = document.getElementById("lvl-tabs");
  const picker = document.getElementById("a-picker");
  const markBtn = document.getElementById("mark-read");
  const vrList = document.getElementById("vr-list");
  const vrCount = document.getElementById("vr-count");
  const params = new URLSearchParams(location.search);
  let lv = parseInt(params.get("lv") || "2", 10);
  if (![1, 2, 3].includes(lv)) lv = 2;
  let aIdx = 0, rate = 1;
  const LV_NAME = { 1: "低", 2: "中", 3: "高" };
  const LV_CLS = { 1: "low", 2: "mid", 3: "high" };

  const listOf = l => ARTICLES.filter(a => a.lv === l);
  function cur() {
    const list = listOf(lv);
    return list[Math.min(aIdx, list.length - 1)];
  }

  function setRead() {
    markBtn.disabled = true;
    markBtn.innerHTML = ICONS.check + "<span>已完成阅读</span>";
  }

  /* ---------------- 右侧词汇栏（TED 式）：重要词汇 + 双向联动 ---------------- */
  function renderRail(a) {
    const proseEl = document.getElementById("prose");
    const keys = Object.keys(a.gloss);
    const paraMap = firstParaMap(keys, proseEl);
    /* 按文章出现顺序排列（未命中的排最后） */
    keys.sort((x, y) => (paraMap.get(x) ?? 1e9) - (paraMap.get(y) ?? 1e9));
    vrCount.textContent = keys.length;
    vrList.innerHTML = keys.map(k => {
      const g = a.gloss[k];
      const para = paraMap.has(k) ? paraMap.get(k) : null;
      return '<div class="vr-item" data-k="' + escHtml(k) + '"' + (para != null ? ' data-para="' + para + '"' : "") + '>' +
        '<div class="vr-row">' +
          '<span class="vr-w">' + escHtml(k) + "</span>" +
          '<span class="vr-pos">' + escHtml(g.pos || "") + "</span>" +
          '<button class="vr-mini" data-act="say" data-w="' + escHtml(k) + '">' + ICONS.speaker + "<span>发音</span></button>" +
          '<button class="vr-mini" data-act="add" data-w="' + escHtml(k) + '">' + ICONS.plus + "<span>生词本</span></button>" +
        "</div>" +
        '<div class="vr-def">' + escHtml(g.def) +
          (para != null ? '<span class="vr-para">第 ' + (para + 1) + " 段</span>" : "") + "</div>" +
      "</div>";
    }).join("");
  }

  /* 词条 → 正文定位：取词还原后匹配词条键（para 限定段落下标时只命中该段） */
  function stemCands(k) {
    const c = [k, k.replace(/'s$/, "")];
    if (/ies$/.test(k)) c.push(k.slice(0, -3) + "y");
    if (/es$/.test(k)) c.push(k.slice(0, -2));
    if (/s$/.test(k) && !/ss$/.test(k)) c.push(k.slice(0, -1));
    if (/ed$/.test(k)) { c.push(k.slice(0, -2)); c.push(k.slice(0, -1)); }
    if (/ing$/.test(k)) { c.push(k.slice(0, -3)); c.push(k.slice(0, -3) + "e"); c.push(k.slice(0, -4)); }
    if (/ly$/.test(k)) c.push(k.slice(0, -2));
    return c;
  }
  function locateWord(key, proseEl, para) {
    const prose = proseEl || document.getElementById("prose");
    if (!prose) return;
    const paras = [...prose.querySelectorAll("p")];
    const toks = prose.querySelectorAll(".tk-x");
    for (const t of toks) {
      const raw = String(t.dataset.w || "").toLowerCase();
      if (!stemCands(raw).includes(key)) continue;
      if (para != null && paras.indexOf(t.closest("p")) !== para) continue;
      t.scrollIntoView({ behavior: "smooth", block: "center" });
      t.classList.remove("hl");
      void t.offsetWidth;
      t.classList.add("hl");
      return;
    }
    /* 限定段落未命中 → 退回全文首个命中 */
    if (para != null) return locateWord(key, proseEl);
    toast("「" + key + "」在当前正文没有高亮形态，可悬停正文查词");
  }

  /* 词 → 首次出现段落下标（供侧栏按文章顺序排列并显示位置） */
  function firstParaMap(keys, proseEl) {
    const set = new Set(keys), map = new Map();
    if (!proseEl) return map;
    [...proseEl.querySelectorAll("p")].forEach((p, i) => {
      (p.textContent.match(/[A-Za-z][A-Za-z'’-]{2,}/g) || []).forEach(tok => {
        if (!set.size) return;
        for (const c of stemCands(tok.toLowerCase())) {
          if (set.has(c)) { set.delete(c); map.set(c, i); break; }
        }
      });
    });
    return map;
  }

  vrList.addEventListener("click", e => {
    const btn = e.target.closest("[data-act]");
    const item = e.target.closest(".vr-item");
    if (btn) {
      const w = btn.dataset.w;
      if (btn.dataset.act === "say") {
        if (!TTS.speak(w)) toast("当前浏览器不支持语音合成");
      } else {
        const hit = DICT[w];
        const added = SRS.addWord(w, hit ? { w, ipa: hit.ipa || "", pos: hit.pos, def: hit.def, ex: "", exZh: "", lv: "阅读" } : null);
        toast(added ? "已加入生词本，明日开始复习" : "已在生词本中");
      }
      return;
    }
    if (item) locateWord(item.dataset.k, null, item.dataset.para != null ? +item.dataset.para : null);
  });

  /* 正文 → 词栏联动：悬停命中词时高亮词条（文章词栏 + 精读词栏同时生效） */
  function railEls() {
    const els = [vrList];
    const nr = document.getElementById("nsr-vr");
    if (nr) els.push(nr);
    return els;
  }
  document.addEventListener("mouseover", e => {
    const tk = e.target.closest && e.target.closest(".tk-x");
    if (!tk) return;
    const raw = String(tk.dataset.w || "").toLowerCase();
    const key = stemCands(raw).find(k => DICT[k]);
    if (!key) return;
    railEls().forEach(list => {
      list.querySelectorAll(".vr-item.on").forEach(x => x.classList.remove("on"));
      const item = list.querySelector('.vr-item[data-k="' + key + '"]');
      if (item) item.classList.add("on");
    });
  });
  document.addEventListener("mouseout", e => {
    if (e.target.closest && e.target.closest(".tk-x")) {
      railEls().forEach(list => list.querySelectorAll(".vr-item.on").forEach(x => x.classList.remove("on")));
    }
  });

  /* ---------------- 正文渲染 ---------------- */
  let readFilter = "";   // 篇目筛选："" 全部 | "unread" 未读 | "read" 已读
  function renderPicker() {
    const list = listOf(lv);
    const readSet = new Set(Stats.readIds);
    const shown = list.map((x, k) => ({ x, k })).filter(it =>
      readFilter === "unread" ? !readSet.has(it.x.id) : readFilter === "read" ? readSet.has(it.x.id) : true);
    picker.innerHTML = list.length > 1
      ? "<span class='a-picker-lab'>篇目</span>"
        + '<span class="a-pf">'
        + [["", "全部"], ["unread", "未读"], ["read", "已读"]].map(f =>
            '<button class="ns-chip' + (readFilter === f[0] ? " active" : "") + '" data-pf="' + f[0] + '">' + f[1] + "</button>").join("")
        + "</span>"
        + shown.map(it =>
            '<button data-ai="' + it.k + '" class="' + (it.k === aIdx ? "active" : "") + (readSet.has(it.x.id) ? " done" : "") + '" title="' + escHtml(it.x.titleZh) + '">'
            + (it.k + 1) + ". " + escHtml(it.x.title) + "</button>").join("")
        + (shown.length ? "" : '<span class="a-pf-empty">该筛选下没有篇目</span>')
      : "";
    picker.querySelectorAll("[data-pf]").forEach(b =>
      b.addEventListener("click", () => { readFilter = b.dataset.pf; renderPicker(); }));
    picker.querySelectorAll("button[data-ai]").forEach(b =>
      b.addEventListener("click", () => { aIdx = +b.dataset.ai; TTS.stop(); render(); }));
  }
  /* 更新已读计数与篇目标记（不重渲染正文） */
  function refreshReadMeta() {
    const list = listOf(lv);
    const readN = list.filter(x => Stats.readIds.includes(x.id)).length;
    const el = document.getElementById("read-count");
    if (el) el.textContent = "已读 " + readN + " / " + list.length + " 篇";
    renderPicker();
  }

  function render() {
    const list = listOf(lv);
    if (aIdx >= list.length) aIdx = 0;
    const a = cur();
    const words = a.paras.join(" ").trim().split(/\s+/).length;
    const mins = Math.max(1, Math.round(words / 100));
    tabs.querySelectorAll("button").forEach(b => b.classList.toggle("active", +b.dataset.lv === lv));
    renderPicker();
    artEl.innerHTML = `
      <div class="a-meta">
        <span class="chip ${LV_CLS[lv]}">${LV_NAME[lv]}难度</span>
        <span class="chip topic">${a.topic}</span>
        <span class="a-info">${words} 词 · 约 ${mins} 分钟 · 原创文章 · <span id="read-count">已读 ${list.filter(x => Stats.readIds.includes(x.id)).length} / ${list.length} 篇</span></span>
      </div>
      <h2 class="a-title">${escHtml(a.title)}</h2>
      <p class="a-titlezh">${escHtml(a.titleZh)}</p>
      <div class="a-bar">
        <button class="btn btn-ghost btn-sm" id="play-all">${ICONS.play}<span>播放全文</span></button>
        <button class="btn btn-ghost btn-sm" id="stop-all">${ICONS.stop}<span>停止</span></button>
        <div class="rate">
          <span>语速</span>
          <button data-r="0.8">0.8×</button>
          <button data-r="1" class="active">1×</button>
          <button data-r="1.2">1.2×</button>
        </div>
      </div>
      <div class="prose" id="prose">${a.paras.map(p => "<p>" + escHtml(p) + "</p>").join("")}</div>`;

    renderRail(a);

    /* 悬浮取词 */
    Dictip.bind(document.getElementById("prose"));

    /* TTS 工具栏 */
    document.getElementById("play-all").addEventListener("click", () => {
      if (!TTS.ok) { toast("当前浏览器不支持语音合成"); return; }
      const text = a.paras.join(" ");
      const sents = (text.match(/[^.!?]+[.!?]+["']?\s*/g) || [text]).map(s => s.trim()).filter(Boolean);
      TTS.speakSeq(sents, rate);
    });
    document.getElementById("stop-all").addEventListener("click", () => TTS.stop());
    artEl.querySelectorAll(".rate button").forEach(b =>
      b.addEventListener("click", () => {
        rate = parseFloat(b.dataset.r);
        artEl.querySelectorAll(".rate button").forEach(x => x.classList.toggle("active", x === b));
      }));

    /* 已读状态（切页后重置按钮再按进度点亮） */
    markBtn.disabled = false;
    markBtn.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg><span>标记已完成阅读</span>';
    if (Prog.read.includes(a.id)) setRead();
  }

  /* 切换级别 / 初始进入：定位到该级别第一篇「未读」文章（全部已读则回到第 1 篇） */
  function firstUnread() {
    const list = listOf(lv);
    const i = list.findIndex(x => !Stats.readIds.includes(x.id));
    return i < 0 ? 0 : i;
  }

  tabs.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => { lv = +b.dataset.lv; aIdx = firstUnread(); TTS.stop(); render(); }));

  markBtn.addEventListener("click", () => {
    Prog.markRead(cur().id);
    setRead();
    refreshReadMeta();
    toast("已记录今日阅读，任务卡已点亮");
    Stats.touch();
  });

  /* 推送下一篇：优先跳到下一篇「未读」文章（全部已读时循环下一篇），滚动回正文顶部 */
  document.getElementById("next-art").addEventListener("click", () => {
    const list = listOf(lv);
    const readSet = new Set(Stats.readIds);
    let n = (aIdx + 1) % list.length;
    for (let i = 1; i <= list.length && readSet.has(list[n].id); i++) n = (n + 1) % list.length;
    aIdx = n;
    TTS.stop();
    render();
    artEl.scrollIntoView({ behavior: "smooth", block: "start" });
    toast("已推送到「" + cur().titleZh + "」" + (readSet.has(cur().id) ? "（本级别已全部读完）" : ""));
  });

  /* ================= 全库检索：文章（标题/主题/正文）+ 词库（词形/释义） ================= */
  const rIn = document.getElementById("r-search");
  const rMeta = document.getElementById("rsp-meta");
  const rRes = document.getElementById("rsp-results");
  const rDet = document.getElementById("rsp-detail");
  const rClr = document.getElementById("rsp-clear");

  /* 文章索引：标题 / 中文题名 / 主题 / 正文（小写拼接缓存） */
  const ART_IDX = ARTICLES.map(a => ({
    a, tl: a.title.toLowerCase(), zh: a.titleZh || "", tp: (a.topic || "").toLowerCase(), txt: a.paras.join(" ").toLowerCase()
  }));
  /* 词库索引：精选 160 详解 ∪ DICT 全部词条（含各文章术语） */
  const DICT_IDX = (() => {
    const map = new Map();
    WORDS.forEach(x => map.set(x.w.toLowerCase(), { w: x.w, ipa: x.ipa || "", pos: x.pos || "", def: x.def, ex: x.ex || "", exZh: x.exZh || "", cur: true }));
    Object.keys(DICT).forEach(k => { if (!map.has(k)) map.set(k, { w: k, ipa: DICT[k].ipa || "", pos: DICT[k].pos || "", def: DICT[k].def || "", ex: "", exZh: "", cur: false }); });
    return [...map.values()];
  })();

  /* 五级模糊打分：精确 > 前缀 > 包含 > 子序列 > 有界编辑距离 */
  function subseq(q, h) {
    let i = 0;
    for (const ch of h) { if (ch === q[i] && ++i === q.length) return true; }
    return false;
  }
  function lev2(a, b) {
    if (Math.abs(a.length - b.length) > 2) return -1;
    let prev = new Array(b.length + 1), cur = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      cur[0] = i;
      let best = cur[0];
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < best) best = cur[j];
      }
      if (best > 2) return -1;
      const t = prev; prev = cur; cur = t;
    }
    return prev[b.length] > 2 ? -1 : prev[b.length];
  }
  function scoreOf(q, h) {
    if (h === q) return 100;
    if (h.startsWith(q)) return 90 - Math.min(10, h.length - q.length);
    if (h.includes(q)) return 70 - (h.length - q.length);
    if (q.length >= 2 && subseq(q, h)) return 50 - Math.min(10, h.length - q.length);
    if (q.length >= 3) { const d = lev2(q, h); if (d >= 0) return 46 - d * 8; }
    return 0;
  }

  /* 正文命中摘要：截取上下文并高亮 */
  function snippet(txt, q) {
    const i = txt.indexOf(q);
    if (i < 0) return "";
    const s = Math.max(0, i - 44), e = Math.min(txt.length, i + q.length + 72);
    return (s > 0 ? "…" : "") + escHtml(txt.slice(s, i)) +
      '<mark class="rs-mark">' + escHtml(q) + "</mark>" +
      escHtml(txt.slice(i + q.length, e)) + (e < txt.length ? "…" : "");
  }
  const LV_CHIP = { 1: '<span class="rs-lv low">低</span>', 2: '<span class="rs-lv mid">中</span>', 3: '<span class="rs-lv high">高</span>' };

  function openArticle(a) {
    lv = a.lv;
    const list = listOf(lv);
    aIdx = Math.max(0, list.findIndex(x => x.id === a.id));
    TTS.stop();
    rRes.hidden = true; rMeta.hidden = true;
    render();
    artEl.scrollIntoView({ behavior: "smooth", block: "start" });
    toast("已切换到「" + a.titleZh + "」");
  }

  /* 词条详情卡（检索结果点击展开；返回按钮回到结果列表） */
  let rLast = null;
  function showWDetail(w) {
    rLast = w;
    rRes.hidden = true; rMeta.hidden = true; rDet.hidden = false;
    const ipa = w.ipa ? '<span class="sd-ipa">' + escHtml(w.ipa) + "</span>" : "";
    rDet.innerHTML = `
      <div class="sd-head">
        <span class="sd-w">${escHtml(w.w)}</span>${ipa}
        <span class="sr-lv">${w.cur ? "精选详解" : "词库"}</span>
        <span class="sd-acts">
          <button class="dt-btn" data-act="say" data-word="${escHtml(w.w)}">${ICONS.speaker}<span>发音</span></button>
          <button class="dt-btn" data-act="add" data-word="${escHtml(w.w)}">${ICONS.plus}<span>生词本</span></button>
        </span>
      </div>
      <div class="sd-def"><span class="sd-pos">${escHtml(w.pos || "n.")}</span>${escHtml(w.def)}</div>
      ${w.ex ? '<div class="sd-ex">' + escHtml(w.ex) + '<div class="zh">' + escHtml(w.exZh || "") + "</div></div>" : ""}
      <button class="rs-back" id="rs-back">← 返回检索结果</button>`;
    rDet.querySelectorAll("[data-act]").forEach(b =>
      b.addEventListener("click", () => {
        if (b.dataset.act === "say") {
          if (!TTS.speak(b.dataset.word)) toast("当前浏览器不支持语音合成");
        } else {
          const hit = DICT[b.dataset.word.toLowerCase()] || (w.cur ? WORDS.find(x => x.w.toLowerCase() === b.dataset.word.toLowerCase()) : null);
          const info = hit ? { w: w.w, ipa: hit.ipa || "", pos: hit.pos, def: hit.def, ex: "", exZh: "", lv: "阅读" } : null;
          const added = SRS.addWord(b.dataset.word.toLowerCase(), info);
          toast(added ? "已加入生词本，明日开始复习" : "已在生词本中");
        }
      }));
    document.getElementById("rs-back").addEventListener("click", () => {
      rDet.hidden = true;
      if (rLast) { rRes.hidden = false; rMeta.hidden = false; }
    });
  }

  let rTimer = null;
  function doSearch() {
    const q = rIn.value.trim().toLowerCase();
    rClr.hidden = !q;
    rDet.hidden = true;
    if (q.length < 2) { rRes.hidden = true; rMeta.hidden = true; return; }
    const cjk = /[\u4e00-\u9fff]/.test(q);

    /* 文章：标题模糊 > 正文包含 > 中文题名/主题 */
    const arts = [];
    for (const e of ART_IDX) {
      let s = 0;
      if (!cjk) {
        s = scoreOf(q, e.tl);
        if (!s && e.txt.includes(q)) s = 45;
      }
      if (!s && (e.zh.includes(q) || e.tp.includes(q))) s = 40;
      if (s > 0) arts.push({ e, s });
    }
    arts.sort((x, y) => y.s - x.s);

    /* 词条：词形模糊 > 中文释义包含 */
    const words = [];
    for (const w of DICT_IDX) {
      let s = cjk ? 0 : scoreOf(q, w.w.toLowerCase());
      if (!s && (w.def.includes(q) || (w.exZh || "").includes(q))) s = 40;
      if (s > 0) words.push({ w, s });
    }
    words.sort((a, b) => b.s - a.s || a.w.w.localeCompare(b.w.w));

    const topA = arts.slice(0, 12), topW = words.slice(0, 18);
    rMeta.hidden = false;
    rMeta.textContent = topA.length || topW.length
      ? "文库命中 " + arts.length + " 篇（显示前 " + topA.length + "） · 词库命中 " + words.length + " 词（显示前 " + topW.length + "，共索引 " + DICT_IDX.length + " 词条）"
      : "没有相近的结果，试试更短或更常见的拼写（如 cran、提单）";
    if (!topA.length && !topW.length) { rRes.hidden = true; return; }
    rRes.hidden = false;

    let html = "";
    if (topA.length) {
      html += '<div class="rs-group">文章 · ' + topA.length + "</div>" + topA.map((x, i) => {
        const a = x.e.a;
        const sn = (!cjk && x.e.txt.includes(q)) ? '<p class="rs-snip">' + snippet(x.e.txt, q) + "</p>" : "";
        return '<button class="rs-art" data-ai="' + i + '">' +
          '<span class="rs-meta">' + LV_CHIP[a.lv] + '<span class="rs-topic">' + escHtml(a.topic) + "</span></span>" +
          '<span class="rs-tt">' + escHtml(a.title) + '<i class="rs-zh">' + escHtml(a.titleZh) + "</i></span>" +
          sn + "</button>";
      }).join("");
    }
    if (topW.length) {
      html += '<div class="rs-group">词条 · ' + topW.length + "</div>" + topW.map((x, i) =>
        '<button class="sr-row rs-wrow" data-wi="' + i + '">' +
          '<span class="sr-w">' + escHtml(x.w.w) + "</span>" +
          (x.w.cur ? '<span class="sr-tag">详解</span>' : "") +
          '<span class="sr-prev">' + escHtml(x.w.pos ? x.w.pos + " " : "") + escHtml(x.w.def) + "</span>" +
        "</button>").join("");
    }
    rRes.innerHTML = html;

    rRes.querySelectorAll(".rs-art").forEach(b =>
      b.addEventListener("click", () => openArticle(topA[+b.dataset.ai].e.a)));
    rRes.querySelectorAll(".rs-wrow").forEach(b =>
      b.addEventListener("click", () => showWDetail(topW[+b.dataset.wi].w)));
  }

  rIn.addEventListener("input", () => { clearTimeout(rTimer); rTimer = setTimeout(doSearch, 160); });
  rClr.addEventListener("click", () => { rIn.value = ""; doSearch(); rIn.focus(); });

  /* 初始进入：定位到当前级别第一篇未读文章（已读完的不再推送） */
  aIdx = firstUnread();
  render();

  /* ================= 新闻速览（多源：CGTN RSS + China Daily；元数据 + 可精读全文） ================= */
  const nsList = document.getElementById("ns-list");

  const nsBadge = document.getElementById("ns-badge");

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  /* ---- 表盘：今日/近7天新增、类型分布（数据来自 /api/news/stats） ---- */
  async function loadStats() {
    if (!IS_SERVER) return;
    try {
      const r = await fetch("/api/news/stats", { signal: AbortSignal.timeout(8000) });
      if (!r.ok) return;
      const s = await r.json();
      if (!s.ok) return;
      nsDash.hidden = false;
      nsdToday.textContent = s.today.total;
      nsdWeek.textContent = s.days.reduce((a, x) => a + x.n, 0);
      nsdTotal.textContent = s.total;
      nsdReadable.textContent = s.readable;
      const max = Math.max(1, ...s.days.map(x => x.n));
      nsdBars.innerHTML = s.days.map(x =>
        '<div class="nsd-bar" title="' + x.d + ' 新增 ' + x.n + ' 条">' +
          '<i style="height:' + Math.max(4, Math.round(x.n / max * 54)) + 'px"></i>' +
          "<em>" + x.d.slice(5).replace("-", "/") + "</em></div>").join("");
      const tmax = Math.max(1, ...s.today.bySource.map(x => x.n));
      nsdSrc.innerHTML = s.today.bySource.length
        ? s.today.bySource.map(x =>
            '<div class="nsd-tr" title="' + escHtml(x.k) + "：今日新增 " + x.n + ' 条">' +
              '<span class="nsd-tk">' + escHtml(x.k) + "</span>" +
              '<i style="width:' + Math.max(8, Math.round(x.n / tmax * 100)) + '%"></i>' +
              "<b>" + x.n + "</b></div>").join("")
        : '<p class="nsd-nil">今日暂无新增——点「刷新」立即抓取</p>';
    } catch (e) { /* 表盘失败不影响新闻列表 */ }
  }

  /* ---- 检索条件 → 查询串 ---- */
  function newsQuery() {
    let qs = "limit=60";
    if (nsTopic) qs += "&topic=" + encodeURIComponent(nsTopic);
    if (nsQuery) qs += "&q=" + encodeURIComponent(nsQuery);
    const dm = nsDateMode.value;
    if (dm === "today") {
      const d = new Date();
      qs += "&date=" + d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    } else if (dm === "date" && nsDateVal) {
      qs += "&date=" + nsDateVal;
    } else if (/^\d+$/.test(dm)) {
      qs += "&days=" + dm;
    }
    return qs;
  }
  function renderNews() {
    const items = nsTopic ? nsItems.filter(x => x.tp === nsTopic) : nsItems;
    const shown = items.slice(0, 60);
    nsChips.innerHTML = '<button class="ns-chip' + (nsTopic === "" ? " active" : "") + '" data-t="">全部</button>' +
      nsTopics.map(t => '<button class="ns-chip' + (nsTopic === t ? " active" : "") + '" data-t="' + escHtml(t) + '">' + escHtml(t) + "</button>").join("");
    nsChips.querySelectorAll(".ns-chip").forEach(b =>
      b.addEventListener("click", () => { nsTopic = b.dataset.t; renderNews(); }));
    if (!shown.length) {
      nsList.innerHTML = '<div class="ns-empty">暂无新闻——服务器模式下点「刷新」拉取最新条目</div>';
      return;
    }
    nsList.innerHTML = shown.map(x =>
      '<div class="ns-item">' +
        '<div class="ns-meta"><span class="ns-src">' + escHtml(x.s || "媒体") + "</span>" +
        (x.tp ? "<span>" + escHtml(x.tp) + "</span>" : "") +
        (fmtDate(x.d) ? "<span>" + fmtDate(x.d) + "</span>" : "") + "</div>" +
        '<div class="ns-tt">' +
          '<a class="ns-link" href="' + escHtml(x.u) + '" target="_blank" rel="noopener noreferrer">' + escHtml(x.t) + "</a>" +
          (x.c ? '<button class="ns-read" data-id="' + x.id + '" title="站内精读：悬浮取词 · 发音 · 生词本">精读</button>' : "") +
        "</div>" +
        (x.x ? '<p class="ns-x">' + escHtml(x.x) + "</p>" : "") +
      "</div>").join("");
  }

  function applyNews(payload, live) {
    nsItems = (payload.items || []).map(x => ({
      id: x.id || 0, c: x.c ? 1 : 0,
      t: x.t || x.title, u: x.u || x.link, s: x.s || x.source,
      tp: x.tp || x.topic, d: x.d || x.published, x: x.x || x.summary
    }));
    nsTopics = payload.topics || [...new Set(nsItems.map(x => x.tp))];
    nsBadge.textContent = live ? "实时" : "快照";
    nsBadge.classList.toggle("snap", !live);
    const filtering = payload.q || payload.date || payload.days;
    nsNote.textContent = live
      ? (filtering
          ? "检索" + (payload.q ? "「" + payload.q + "」" : "") +
            (payload.date ? "（" + payload.date + "）" : "") + (payload.days ? "（近 " + payload.days + " 天）" : "") +
            "：命中 " + (payload.matched != null ? payload.matched : nsItems.length) + " 条，当前展示 " + nsItems.length +
            " 条（库共 " + (payload.total || 0) + " 条）。清除条件后恢复默认列表。"
          : "来源：CGTN 八版块、China Daily 七频道与 gCaptain/Splash247/Hellenic/Loadstar/Container News 五大港航物流媒体（共 " + (payload.total || nsItems.length) +
            " 条已入库，" + (payload.readable || 0) + " 条可站内精读，持续累积）；「精读」站内阅读，或点标题跳原文。")
      : "当前为内置快照（" + nsItems.length + " 条）；启动 node server/server.js 后可实时刷新、抓取 China Daily 与港航媒体并精读全文。";
    nsRefresh.hidden = !IS_SERVER;
    renderNews();
  }

  async function loadNews(force) {
    if (IS_SERVER) {
      try {
        const q = "/api/news?" + newsQuery() + (force ? "&refresh=1" : "");
        const r = await fetch(q, { signal: AbortSignal.timeout(20000) });
        if (r.ok) { applyNews(await r.json(), true); return; }
      } catch (e) { /* 超时或网络异常 → 落回快照 */ }
    }
    if (typeof EV_NEWS_SNAPSHOT !== "undefined" && EV_NEWS_SNAPSHOT) {
      applyNews(EV_NEWS_SNAPSHOT, false);
    } else {
      applyNews({ items: [], topics: [], total: 0 }, false);
    }
  }

  nsRefresh.addEventListener("click", () => {
    nsRefresh.textContent = "刷新中…";
    loadNews(true).then(() => { nsRefresh.textContent = "刷新"; loadStats(); });
  });

  /* ---- 检索交互：Enter / 按钮 / 日期模式切换 / 清除 ---- */
  if (IS_SERVER) {
    nsSearch.hidden = false;
    const doSearch = () => {
      nsQuery = nsQ.value.trim();
      nsGo.textContent = "检索中…";
      loadNews(false).then(() => {
        nsGo.textContent = "检索";
        nsReset.hidden = !(nsQuery || nsDateMode.value);
      });
    };
    nsGo.addEventListener("click", doSearch);
    nsQ.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
    nsDateMode.addEventListener("change", () => {
      nsDateVal = "";
      nsDate.hidden = nsDateMode.value !== "date";
      if (nsDateMode.value !== "date") doSearch();
    });
    nsDate.addEventListener("change", () => { nsDateVal = nsDate.value; if (nsDateVal) doSearch(); });
    nsReset.addEventListener("click", () => {
      nsQuery = ""; nsDateVal = "";
      nsQ.value = ""; nsDateMode.value = ""; nsDate.value = ""; nsDate.hidden = true;
      nsReset.hidden = true;
      loadNews(false);
    });
  }

  loadStats();

  nsList.addEventListener("click", e => {
    const btn = e.target.closest(".ns-read");
    if (btn) openReader(parseInt(btn.dataset.id, 10));
  });

  loadNews(false);

  /* ================= 新闻精读浮层 ================= */
  const nsReader = document.getElementById("ns-reader");
  const nsrTitle = document.getElementById("nsr-title");
  const nsrSrc = document.getElementById("nsr-src");
  const nsrTopicEl = document.getElementById("nsr-topic");
  const nsrDate = document.getElementById("nsr-date");
  const nsrLink = document.getElementById("nsr-link");
  const nsrProse = document.getElementById("nsr-prose");
  const nsrVr = document.getElementById("nsr-vr");
  const nsrCount = document.getElementById("nsr-count");
  let nsrParas = [], nsrRateV = 1;

  /* 从正文中抽取词典命中的「新闻热词」（词形还原，按出现顺序记录所在段落，最多 24 个） */
  function newsVocab(paras) {
    const seen = new Set(), hits = [];
    paras.forEach((text, pi) => {
      const tokens = (String(text).match(/[A-Za-z][A-Za-z'’-]{2,}/g) || []).map(t => t.toLowerCase());
      for (const t of tokens) {
        for (const c of stemCands(t)) {
          if (DICT[c] && !seen.has(c)) {
            seen.add(c);
            const g = DICT[c];
            hits.push({ k: c, pos: g.pos || "", def: g.def, ipa: g.ipa || "", para: pi });
          }
        }
      }
    });
    return hits.slice(0, 24);
  }
  function renderNsrRail() {
    const hits = newsVocab(nsrParas);
    nsrCount.textContent = hits.length;
    nsrVr.innerHTML = hits.map(h =>
      '<div class="vr-item" data-k="' + escHtml(h.k) + '" data-para="' + h.para + '">' +
        '<div class="vr-row">' +
          '<span class="vr-w">' + escHtml(h.k) + "</span>" +
          '<span class="vr-pos">' + escHtml(h.pos) + "</span>" +
          '<button class="vr-mini" data-act="say" data-w="' + escHtml(h.k) + '">' + ICONS.speaker + "<span>发音</span></button>" +
          '<button class="vr-mini" data-act="add" data-w="' + escHtml(h.k) + '">' + ICONS.plus + "<span>生词本</span></button>" +
        "</div>" +
        (h.ipa ? '<div class="vr-ipa">' + escHtml(h.ipa) + "</div>" : "") +
        '<div class="vr-def">' + escHtml(h.def) + '<span class="vr-para">第 ' + (h.para + 1) + " 段</span></div>" +
      "</div>").join("");
  }

  nsrVr.addEventListener("click", e => {
    const btn = e.target.closest("[data-act]");
    const item = e.target.closest(".vr-item");
    if (btn) {
      const w = btn.dataset.w;
      if (btn.dataset.act === "say") {
        if (!TTS.speak(w)) toast("当前浏览器不支持语音合成");
      } else {
        const hit = DICT[w];
        const added = SRS.addWord(w, hit ? { w, ipa: hit.ipa || "", pos: hit.pos, def: hit.def, ex: "", exZh: "", lv: "阅读" } : null);
        toast(added ? "已加入生词本，明日开始复习" : "已在生词本中");
      }
      return;
    }
    if (item) locateWord(item.dataset.k, nsrProse, item.dataset.para != null ? +item.dataset.para : null);

  async function openReader(id) {
    if (!id) return;
    try {
      const r = await fetch("/api/news/item?id=" + id, { signal: AbortSignal.timeout(9000) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      const it = data.item;
      if (!it || !it.paras || !it.paras.length) { toast("该条目暂无精读正文，请点击标题跳原文阅读"); return; }
      nsrParas = it.paras;
      nsrTitle.textContent = it.title;
      nsrSrc.textContent = it.source || "媒体";
      nsrTopicEl.textContent = it.topic || "";
      nsrDate.textContent = fmtDate(it.published);
      nsrLink.href = it.link;
      nsrProse.innerHTML = it.paras.map(p => "<p>" + escHtml(p) + "</p>").join("");
      renderNsrRail();
      Dictip.bind(nsrProse);
      nsReader.hidden = false;
      nsReader.querySelector(".nsr-panel").scrollTop = 0;
    } catch (e) {
      toast("精读加载失败——精读需服务器模式（node server/server.js）");
    }
  }
  function closeReader() {
    TTS.stop();
    nsReader.hidden = true;
  }
  document.getElementById("nsr-close").addEventListener("click", closeReader);
  nsReader.addEventListener("click", e => { if (e.target === nsReader) closeReader(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !nsReader.hidden) closeReader(); });

  document.getElementById("nsr-play").addEventListener("click", () => {
    if (!TTS.ok) { toast("当前浏览器不支持语音合成"); return; }
    const text = nsrParas.join(" ");
    const sents = (text.match(/[^.!?]+[.!?]+["']?\s*/g) || [text]).map(s => s.trim()).filter(Boolean);
    TTS.speakSeq(sents, nsrRateV);
  });
  document.getElementById("nsr-stop").addEventListener("click", () => TTS.stop());
  const nsrRateEl = document.getElementById("nsr-rate");
  nsrRateEl.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      nsrRateV = parseFloat(b.dataset.r);
      nsrRateEl.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
    }));
})();
</script>
</body>
</html>
