<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · EverWord</title>
  <link rel="stylesheet" href="css/styles.css?v=1.8.4">
  <style>
    /* ===== 管理后台（复用 Claymorphism 设计令牌） ===== */
    body { background: linear-gradient(160deg, #EEF0FF 0%, #FDF3FA 55%, #EDFAF6 100%); min-height: 100vh; }
    .ad-wrap { max-width: 1200px; margin: 0 auto; padding: 22px 18px 60px; }
    .ad-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .ad-brand { font: 800 19px var(--font-display); color: var(--ink-deep); }
    .ad-brand em { font-style: normal; color: var(--primary); }
    .ad-tag {
      font: 800 10.5px var(--font-body); color: var(--green-deep);
      background: var(--mint-a); padding: 4px 12px; border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, .9);
    }
    .ad-actions { margin-left: auto; display: flex; gap: 8px; }
    .ad-btn {
      border: none; cursor: pointer; text-decoration: none;
      font: 800 12px var(--font-body); color: var(--primary);
      background: var(--blue-a); padding: 8px 15px; border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, .95);
      box-shadow: 2px 3px 6px rgba(30, 27, 75, .10);
      transition: transform .18s var(--ease-bounce);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .ad-btn:hover { transform: translateY(-1px); }
    .ad-btn.ghost { color: var(--ink-mut); background: var(--lilac-a); }

    /* 登录闸口 */
    .ad-gate {
      max-width: 430px; margin: 9vh auto 0; background: #fff;
      border: var(--clay-border); border-radius: var(--r-lg);
      box-shadow: var(--clay-in); padding: 30px 28px; text-align: center;
    }
    .ad-gate h1 { font: 800 21px var(--font-display); color: var(--ink-deep); margin: 0 0 6px; }
    .ad-gate p { font: 500 13px var(--font-body); color: var(--ink-mut); margin: 0 0 18px; }
    .ad-field { text-align: left; margin: 12px 0; }
    .ad-field label { display: block; font: 700 12px var(--font-body); color: var(--ink-deep); margin-bottom: 6px; }
    .ad-field input {
      width: 100%; box-sizing: border-box; border: 2px solid rgba(255, 255, 255, .95); outline: none;
      font: 600 14px var(--font-body); color: var(--ink-deep);
      background: #fff; padding: 11px 15px; border-radius: 14px;
      box-shadow: inset 2px 3px 6px rgba(30, 27, 75, .08);
      transition: box-shadow .18s, border-color .18s;
    }
    .ad-field input:focus { border-color: var(--primary); box-shadow: inset 2px 3px 6px rgba(30,27,75,.05), 0 0 0 4px rgba(99,102,241,.16); }
    .ad-go {
      width: 100%; border: none; cursor: pointer; margin-top: 8px;
      font: 800 14px var(--font-body); color: #fff;
      background: linear-gradient(175deg, var(--primary-soft), var(--primary));
      padding: 12px; border-radius: 14px;
      box-shadow: 3px 4px 10px rgba(79, 70, 229, .35);
      transition: transform .16s var(--ease-bounce);
    }
    .ad-go:hover { transform: translateY(-1px); }
    .ad-err { font: 700 12.5px var(--font-body); color: #DC2626; min-height: 18px; margin-top: 10px; }

    /* KPI 总览 */
    .ad-kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 18px; }
    .ad-kpi {
      background: #fff; border: var(--clay-border); border-radius: 18px;
      box-shadow: var(--clay-in); padding: 14px 10px; text-align: center;
    }
    .ad-kpi b { display: block; font: 800 22px var(--font-display); color: var(--primary); line-height: 1.2; }
    .ad-kpi span { font: 700 11px var(--font-body); color: var(--ink-mut); }

    /* 账号表 */
    .ad-card {
      background: #fff; border: var(--clay-border); border-radius: var(--r-lg);
      box-shadow: var(--clay-in); padding: 16px 16px 6px;
    }
    .ad-card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .ad-card-head h2 { font: 800 16px var(--font-display); color: var(--ink-deep); margin: 0; }
    .ad-filter {
      flex: 1; min-width: 160px; max-width: 300px; border: 2px solid rgba(255, 255, 255, .95); outline: none;
      font: 600 12.5px var(--font-body); color: var(--ink-deep);
      background: #fff; padding: 8px 14px; border-radius: 999px;
      box-shadow: inset 2px 3px 6px rgba(30, 27, 75, .08);
      margin-left: auto;
    }
    .ad-table-wrap { overflow-x: auto; }
    table.ad-table { width: 100%; border-collapse: collapse; font: 500 12.5px var(--font-body); color: var(--ink-deep); }
    .ad-table th {
      text-align: left; font: 800 11px var(--font-body); color: var(--ink-mut);
      padding: 9px 10px; border-bottom: 2px solid rgba(49, 46, 129, .10);
      white-space: nowrap; cursor: pointer; user-select: none;
    }
    .ad-table th:hover { color: var(--primary); }
    .ad-table td { padding: 10px; border-bottom: 2px dashed rgba(49, 46, 129, .10); white-space: nowrap; }
    .ad-table tr:last-child td { border-bottom: none; }
    .ad-table tr:hover td { background: rgba(99, 102, 241, .04); }
    .ad-name { font-weight: 800; }
    .ad-role {
      font: 800 10px var(--font-body); padding: 2px 9px; border-radius: 999px; margin-left: 6px;
      border: 1.5px solid rgba(255, 255, 255, .9); vertical-align: 1px;
    }
    .ad-role.admin { color: #fff; background: var(--primary); }
    .ad-role.user { color: var(--ink-mut); background: var(--lilac-a); }
    .ad-dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; margin-right: 5px; vertical-align: 1px; }
    .ad-dot.on { background: #10B981; box-shadow: 0 0 0 3px rgba(16, 185, 129, .18); }
    .ad-dot.off { background: #CBD5E1; }
    .ad-bar-cell { min-width: 90px; }
    .ad-bar { display: block; height: 8px; border-radius: 999px; background: rgba(99, 102, 241, .12); overflow: hidden; }
    .ad-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #8B5CF6, var(--primary)); }
    .ad-muted { color: var(--ink-mut); }
    .ad-good { color: #059669; font-weight: 800; }
    .ad-warn { color: #D97706; font-weight: 800; }
    .ad-empty { text-align: center; padding: 40px 0; font: 600 13px var(--font-body); color: var(--ink-mut); }
    .ad-del {
      border: 2px solid rgba(255, 255, 255, .92); cursor: pointer;
      font: 800 11px var(--font-body); color: #DC2626;
      background: #FEE2E2; padding: 5px 12px; border-radius: 999px;
      transition: transform .16s var(--ease-bounce), background .16s;
    }
    .ad-del:hover { transform: translateY(-1px); background: #FECACA; }
    .ad-del:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .ad-hint { font: 600 11px var(--font-body); color: var(--ink-mut); margin: 8px 2px 6px; }
    .ad-mode {
      margin-bottom: 14px; padding: 11px 16px; border-radius: 14px;
      font: 700 12.5px var(--font-body); color: #8A5B06;
      background: var(--yellow-a); border: 2px solid rgba(255, 255, 255, .9);
    }
    .ad-promote, .ad-demote {
      border: 2px solid rgba(255, 255, 255, .92); cursor: pointer;
      font: 800 11px var(--font-body); padding: 5px 12px; border-radius: 999px;
      transition: transform .16s var(--ease-bounce), background .16s;
    }
    .ad-promote { color: #fff; background: linear-gradient(175deg, #818CF8, #4F46E5); box-shadow: 2px 3px 7px rgba(79, 70, 229, .35); }
    .ad-promote:hover { transform: translateY(-1px); }
    .ad-demote { color: #4A4690; background: var(--lilac-a); }
    .ad-demote:hover { transform: translateY(-1px); background: var(--lilac-b); }

    @media (max-width: 900px) { .ad-kpis { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 560px) { .ad-kpis { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="ad-wrap">
    <div class="ad-top">
      <span class="ad-brand">EverWord <em>· 管理后台</em></span>
      <span class="ad-tag" id="ad-tag">ADMIN</span>
      <div class="ad-actions">
        <button class="ad-btn" id="ad-refresh">刷新</button>
        <button class="ad-btn ghost" id="ad-csv">导出 CSV</button>
        <a class="ad-btn ghost" href="index.html" id="ad-back">返回应用</a>
      </div>
    </div>

    <!-- 登录闸口 -->
    <div class="ad-gate" id="ad-gate" hidden>
      <h1>管理员登录</h1>
      <p>仅管理员账号可查看账号使用与学习情况（首个注册账号即为管理员）</p>
      <div class="ad-field"><label>用户名</label><input id="ad-name" autocomplete="username" maxlength="24"></div>
      <div class="ad-field"><label>密码</label><input id="ad-pass" type="password" autocomplete="current-password"></div>
      <button class="ad-go" id="ad-login">登录管理后台</button>
      <div class="ad-err" id="ad-err"></div>
    </div>

    <!-- 数据区 -->
    <div id="ad-main" hidden>
      <div class="ad-mode" id="ad-mode" hidden>个人视图：当前账号不是管理员，仅可查看自己的使用数据；由管理员授予权限后可见全部账号。</div>
      <div class="ad-kpis" id="ad-kpis"></div>
      <div class="ad-card">
        <div class="ad-card-head">
          <h2>账号与学习情况</h2>
          <span class="ad-muted" id="ad-count"></span>
          <input class="ad-filter" id="ad-filter" type="search" placeholder="筛选账号名…" maxlength="30">
        </div>
        <div class="ad-table-wrap">
          <table class="ad-table">
            <thead><tr id="ad-thead"></tr></thead>
            <tbody id="ad-tbody"></tbody>
          </table>
        </div>
        <p class="ad-hint">统计口径：各账号「云同步」的学习状态（最后写入胜出）。本机未登录时的学习不计入，登录该账号后自动上传；换账号登录时本机数据按账号归档，不会串号。</p>
      </div>
    </div>
  </div>

  <script>
  "use strict";
  /* ================= 管理后台：账号总览 + 学习情况 ================= */
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDT = s => { if (!s) return "—"; const d = new Date(s.includes("T") ? s : s.replace(" ", "T") + "Z");
    return isNaN(d) ? s : d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")
      + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  const fmtKB = n => n ? (n >= 1024 ? (n / 1024).toFixed(1) + " KB" : n + " B") : "—";

  let USERS = [], sortKey = "syncedAt", sortAsc = false;
  let MODE = "admin";   /* admin = 全部账号视图；self = 个人视图（仅自身数据） */
  let ME = (() => { try { return localStorage.getItem("ev_name") || ""; } catch (e) { return ""; } })();
  const hasTok = (() => { try { return !!localStorage.getItem("ev_token"); } catch (e) { return false; } })();

  async function api(path) {
    let tk = ""; try { tk = localStorage.getItem("ev_token") || ""; } catch (e) {}
    const r = await fetch(path, { headers: { Authorization: "Bearer " + tk }, signal: AbortSignal.timeout(9000) });
    const j = await r.json().catch(() => ({}));
    return { status: r.status, j };
  }

  /* ---- 登录 ---- */
  $("ad-login").addEventListener("click", async () => {
    const name = $("ad-name").value.trim(), pass = $("ad-pass").value;
    $("ad-err").textContent = "";
    if (!name || !pass) { $("ad-err").textContent = "请输入用户名与密码"; return; }
    const btn = $("ad-login"); btn.disabled = true; btn.textContent = "登录中…";
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, password: pass }) });
      const j = await r.json().catch(() => ({}));
      if (r.status !== 200) { $("ad-err").textContent = j.msg || "登录失败"; return; }
      try { localStorage.setItem("ev_token", j.token); localStorage.setItem("ev_name", j.name); localStorage.setItem("ev_role", j.role || "user"); } catch (e) {}
      ME = j.name;
      gate(false);
      if ((j.role || "user") === "admin") { MODE = "admin"; load(); }
      else { MODE = "self"; loadSelf(); }
    } catch (e) { $("ad-err").textContent = "网络异常：" + e.message; }
    finally { btn.disabled = false; btn.textContent = "登录管理后台"; }
  });
  $("ad-pass").addEventListener("keydown", e => { if (e.key === "Enter") $("ad-login").click(); });

  function gate(show) { $("ad-gate").hidden = !show; $("ad-main").hidden = show; }

  /* ---- 总览 KPI ---- */
  function kpis(o) {
    const items = [
      ["账号总数", o.users], ["管理员", o.admins], ["今日活跃", o.activeToday],
      ["今日同步", o.syncsToday], ["今日新增新闻", o.newsToday], ["新闻总量", o.newsTotal]
    ];
    $("ad-kpis").innerHTML = items.map(x => '<div class="ad-kpi"><b>' + x[1] + "</b><span>" + x[0] + "</span></div>").join("");
  }

  /* ---- 账号表 ---- */
  const COLS = [
    { k: "name", t: "账号", render: u => '<span class="ad-name">' + esc(u.name) + '</span><span class="ad-role ' + u.role + '">' + (u.role === "admin" ? "管理员" : "成员") + "</span>" },
    { k: "activeToday", t: "今日", render: u => '<span class="ad-dot ' + (u.activeToday ? "on" : "off") + '"></span>' + (u.activeToday ? "已学习" : "未学习") },
    { k: "createdAt", t: "注册时间", render: u => fmtDT(u.createdAt) },
    { k: "lastSeen", t: "最近活跃", render: u => fmtDT(u.lastSeen) },
    { k: "syncedAt", t: "最近同步", render: u => fmtDT(u.syncedAt) },
    { k: "learned", t: "已学 / 卡片", render: u => u.cards ? "<b>" + u.learned + "</b> / " + u.cards : '<span class="ad-muted">未开始</span>' },
    { k: "due", t: "待复习", render: u => u.cards
        ? (u.due > 20 ? '<span class="ad-warn">' + u.due + "</span>" : u.due)
          + (u.due ? "" : (u.dueTomorrow ? '<span class="ad-muted"> · 明日 ' + u.dueTomorrow + "</span>" : ""))
        : '<span class="ad-muted">—</span>' },
    { k: "streak", t: "连续天数", render: u => u.streak ? '<span class="ad-good">' + u.streak + " 天</span>" : '<span class="ad-muted">0</span>' },
    { k: "readTotal", t: "阅读", render: u => u.readTotal
        ? "<b>" + u.readTotal + "</b> 篇" + (u.readToday ? "<span class='ad-muted'>（今日 " + u.readToday + "）</span>" : "")
        : (u.readToday ? "<b>0</b> 篇<span class='ad-muted'>（今日 " + u.readToday + "）</span>" : '<span class="ad-muted">0 篇</span>') },
    { k: "acc", t: "正确率", render: u => (u.acc == null ? '<span class="ad-muted">—</span>' : u.acc + "%<span class='ad-muted'>（" + u.quizTotal + " 题）</span>")
        + (u.quizToday ? "<span class='ad-good' title='今日已完成测验'> · 今日已测</span>" : "") },
    { k: "level", t: "设置", render: u => (u.level || '<span class="ad-muted">默认</span>') + (u.newPerDay ? " · " + u.newPerDay + " 词/天" : "") },
    { k: "bytes", t: "云存档", render: u => '<span class="ad-bar-cell"><span class="ad-bar"><i style="width:' + Math.min(100, Math.round(u.bytes / 5120)) + '%"></i></span><span class="ad-muted">' + fmtKB(u.bytes) + "</span></span>" },
    { k: "id", t: "操作", render: u => {
        if (MODE !== "admin") return '<span class="ad-muted">—</span>';
        if (u.name === ME) return '<span class="ad-muted">当前账号</span>';
        return (u.role === "admin"
            ? '<button class="ad-demote" data-id="' + u.id + '" data-name="' + esc(u.name) + '" title="取消管理员权限">取消管理员</button> '
            : '<button class="ad-promote" data-id="' + u.id + '" data-name="' + esc(u.name) + '" title="授予管理员权限">设为管理员</button> ')
          + '<button class="ad-del" data-id="' + u.id + '" data-name="' + esc(u.name) + '">删除</button>';
      } }
  ];
  function renderTable() {
    const kw = ($("ad-filter").value || "").trim().toLowerCase();
    let rows = kw ? USERS.filter(u => u.name.toLowerCase().includes(kw)) : USERS.slice();
    const col = COLS.find(c => c.k === sortKey) || COLS[0];
    rows.sort((a, b) => {
      const va = a[sortKey], vb = b[sortKey];
      const cmp = typeof va === "string" ? String(va).localeCompare(String(vb)) : (Number(va) || 0) - (Number(vb) || 0);
      return sortAsc ? cmp : -cmp;
    });
    $("ad-thead").innerHTML = COLS.map(c =>
      "<th data-k=\"" + c.k + "\">" + c.t + (sortKey === c.k ? (sortAsc ? " ↑" : " ↓") : "") + "</th>").join("");
    $("ad-tbody").innerHTML = rows.length
      ? rows.map(u => "<tr>" + COLS.map(c => "<td>" + c.render(u) + "</td>").join("") + "</tr>").join("")
      : '<tr><td colspan="' + COLS.length + '" class="ad-empty">没有匹配的账号</td></tr>';
    $("ad-count").textContent = "共 " + USERS.length + " 个账号" + (kw ? "，筛选出 " + rows.length + " 个" : "");
  }
  $("ad-thead").closest("table").addEventListener("click", e => {
    const th = e.target.closest("th[data-k]");
    if (!th) return;
    if (sortKey === th.dataset.k) sortAsc = !sortAsc; else { sortKey = th.dataset.k; sortAsc = false; }
    renderTable();
  });
  $("ad-filter").addEventListener("input", renderTable);

  /* 删除账号 / 角色变更（管理员视图） */
  $("ad-tbody").addEventListener("click", async e => {
    const btn = e.target.closest(".ad-del");
    if (!btn) return;
    if (!confirm("确定删除账号「" + btn.dataset.name + "」？其云同步学习数据将一并清除，不可恢复。")) return;
    btn.disabled = true; btn.textContent = "删除中…";
    try {
      let tk = ""; try { tk = localStorage.getItem("ev_token") || ""; } catch (e2) {}
      const r = await fetch("/api/admin/user?id=" + btn.dataset.id, { method: "DELETE", headers: { Authorization: "Bearer " + tk } });
      if (r.status === 200) load();
      else { const j = await r.json().catch(() => ({})); alert("删除失败：" + (j.msg || r.status)); btn.disabled = false; btn.textContent = "删除"; }
    } catch (e2) { alert("网络异常：" + e2.message); btn.disabled = false; btn.textContent = "删除"; }
  });
  $("ad-tbody").addEventListener("click", async e => {
    const btn = e.target.closest(".ad-promote,.ad-demote");
    if (!btn) return;
    const toAdmin = btn.classList.contains("ad-promote");
    const act = toAdmin ? "授予「" + btn.dataset.name + "」管理员权限" : "取消「" + btn.dataset.name + "」管理员权限";
    if (!confirm("确定" + act + "？")) return;
    btn.disabled = true;
    try {
      let tk = ""; try { tk = localStorage.getItem("ev_token") || ""; } catch (e2) {}
      const r = await fetch("/api/admin/role", {
        method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tk },
        body: JSON.stringify({ id: Number(btn.dataset.id), role: toAdmin ? "admin" : "user" })
      });
      if (r.status === 200) load();
      else { const j = await r.json().catch(() => ({})); alert("操作失败：" + (j.msg || r.status)); btn.disabled = false; }
    } catch (e2) { alert("网络异常：" + e2.message); btn.disabled = false; }
  });

  /* ---- CSV 导出（Excel 友好：UTF-8 BOM） ---- */
  $("ad-csv").addEventListener("click", () => {
    if (!USERS.length) return;
    const head = ["账号", "角色", "注册时间", "最近活跃", "最近同步", "卡片数", "已学", "待复习", "连续天数", "最佳", "累计阅读", "今日阅读", "正确率%", "测验题数", "今日已测", "今日已学习", "级别", "每日词量", "云存档字节"];
    const lines = [head.join(",")].concat(USERS.map(u => [
      u.name, u.role, u.createdAt || "", u.lastSeen || "", u.syncedAt || "",
      u.cards, u.learned, u.due, u.streak, u.best, u.readTotal || 0, u.readToday || 0,
      u.acc == null ? "" : u.acc, u.quizTotal, u.quizToday ? "是" : "否",
      u.activeToday ? "是" : "否", u.level || "", u.newPerDay || "", u.bytes
    ].map(v => { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")));
    const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "everword-accounts-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  /* ---- 加载：管理员视图（全部账号） / 个人视图（仅自身） ---- */
  function applyMode() {
    const self = MODE === "self";
    $("ad-mode").hidden = !self;
    $("ad-tag").textContent = self ? "个人视图" : "ADMIN";
  }
  function kpisSelf(u) {
    const items = [
      ["今日学习", u.activeToday ? "已学习" : "未学习"],
      ["连续天数", u.streak + " 天"], ["已学 / 卡片", u.learned + " / " + u.cards],
      ["待复习", u.due], ["累计阅读", (u.readTotal || 0) + " 篇" + (u.readToday ? " · 今日 " + u.readToday : "")],
      ["正确率", (u.acc == null ? "—" : u.acc + "%") + (u.quizToday ? " · 今日已测" : "")]
    ];
    $("ad-kpis").innerHTML = items.map(x => '<div class="ad-kpi"><b>' + x[1] + "</b><span>" + x[0] + "</span></div>").join("");
  }
  async function load() {
    try {
      const [ov, us] = await Promise.all([api("/api/admin/overview"), api("/api/admin/users")]);
      if (ov.status === 401 || us.status === 401) { gate(true); $("ad-err").textContent = "登录已过期，请重新登录"; return; }
      if (ov.status === 403 || us.status === 403) { MODE = "self"; return loadSelf(); }
      gate(false);
      MODE = "admin"; applyMode();
      if (ov.j.ok) kpis(ov.j);
      if (us.j.ok) { USERS = us.j.users || []; renderTable(); }
    } catch (e) {
      $("ad-count").textContent = "加载失败：" + e.message;
    }
  }
  async function loadSelf() {
    try {
      const me = await api("/api/me/usage");
      if (me.status === 401) { gate(true); $("ad-err").textContent = "登录已过期，请重新登录"; return; }
      if (!me.j.ok) return;
      gate(false);
      MODE = "self"; applyMode();
      const u = me.j.user;
      ME = u.name;
      kpisSelf(u);
      USERS = [u];
      renderTable();
    } catch (e) {
      $("ad-count").textContent = "加载失败：" + e.message;
    }
  }
  $("ad-refresh").addEventListener("click", () => (MODE === "self" ? loadSelf() : load()));

  /* 返回应用：若本后台标签是由应用页新开的（opener 存在），聚焦原标签并关闭自己，避免开出第二个应用页 */
  $("ad-back").addEventListener("click", e => {
    if (window.opener && !window.opener.closed) {
      e.preventDefault();
      try { window.opener.focus(); } catch (err) {}
      window.close();
      /* 部分浏览器限制关闭非脚本打开的标签 → 关闭失败则就地返回 */
      setTimeout(() => { location.href = "index.html"; }, 120);
    }
  });

  (function init() {
    if (hasTok) load();   /* load 内部处理 401 → 登录闸口；403 → 自动转个人视图 */
    else gate(true);
  })();
  </script>
</body>
</html>
