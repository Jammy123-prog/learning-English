<script>
(function () {
  const mount = document.getElementById("quiz-mount");
  const params = new URLSearchParams(location.search);
  const exam = params.get("exam");
  const S = (typeof Settings === "object") ? Settings : { level: "全部", newPerDay: NEW_PER_DAY };

  /* ---- 可复现随机（当日种子） ---- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function seedOf(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = h << 13 | h >>> 19;
    }
    return h >>> 0;
  }
  function shuffle(arr, rnd) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---- 每日测验：4 道生成题（2 词汇 + 2 填空）+ 8 道固定题 ----
     出题词池跟随单词页所选级别（Settings.level），保证学什么练什么 */
  function buildDaily() {
    const rnd = mulberry32(seedOf(todayStr()));
    const lvWords = (S.level === "全部" || WORDS.filter(w => w.lv === S.level).length < 8)
      ? WORDS
      : WORDS.filter(w => w.lv === S.level);
    const todayLearned = lvWords.filter(w => { const c = SRS.getCard(w.w); return c && c.intro === todayStr(); });
    const otherLearned = lvWords.filter(w => { const c = SRS.getCard(w.w); return c && c.intro !== todayStr(); });
    const fresh = lvWords.filter(w => SRS.isNew(w.w)).slice(0, S.newPerDay);
    const pool = shuffle(todayLearned.concat(otherLearned, fresh), rnd).slice(0, 4);
    const gens = [];
    pool.forEach((w, i) => {
      if (i % 2 === 0) {
        /* 词汇释义 */
        const ds = shuffle(lvWords.filter(x => x.w !== w.w), rnd).slice(0, 3).map(x => x.def);
        const options = shuffle([w.def].concat(ds), rnd);
        gens.push({
          id: "g-" + w.w + "-v", type: "词汇释义", word: w.w,
          stem: "「<span class=\"qw\">" + w.w + "</span>」的中文释义是？",
          options,
          answer: options.indexOf(w.def),
          explain: w.w + " " + w.ipa + " " + w.pos + " " + w.def + "。例句：" + w.ex
        });
      } else {
        /* 语境填空 */
        const ws = shuffle(lvWords.filter(x => x.w !== w.w), rnd).slice(0, 3).map(x => x.w);
        const options = shuffle([w.w].concat(ws), rnd);
        gens.push({
          id: "g-" + w.w + "-c", type: "语境填空", word: w.w,
          stem: w.ex.replace(new RegExp("\\b" + w.w + "\\b", "i"), "______"),
          options,
          answer: options.indexOf(w.w),
          explain: w.w + "（" + w.def + "）符合此处语境。原句：" + w.ex
        });
      }
    });
    return shuffle(gens.concat(DAILY_FIXED), rnd);
  }

  let questions, title, sub, mode;
  if (exam) {
    const map = {
      "CET-4": "四级 CET-4", "CET-6": "六级 CET-6", "TEM-8": "专八 TEM-8", "IELTS": "雅思 IELTS"
    };
    questions = BANK.filter(q => q.exam === exam);
    title = "题库练习 · " + (map[exam] || exam);
    sub = "整卷练习 " + questions.length + " 题 · 原创模拟题";
    mode = "practice";
    document.getElementById("q-title").textContent = "题库练习";
    document.getElementById("q-sub").textContent = sub + " · 答完即出解析与得分";
    if (!questions.length) {
      mount.innerHTML = '<div class="bezel q-card anim-in"><div class="core q-intro"><h2 class="q-intro-t">未找到该题库</h2><p class="page-sub">请从题库页面进入练习。</p></div></div>';
      return;
    }
  } else {
    questions = buildDaily();
    title = "每日测验";
    mode = "daily";
  }

  new Quiz(mount, { questions, title, sub, mode }).intro();
})();
</script>
